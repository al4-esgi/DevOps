# https://taskfile.dev

version: "3"

vars:
  CLUSTER_NAME: devops
  NAMESPACE: devops

tasks:
  default:
    desc: Affiche les tâches disponibles
    cmds:
      - task --list
    silent: true

  up:
    desc: Crée le cluster k3d avec les ports 80 et 443 exposés
    cmds:
      - k3d cluster create {{.CLUSTER_NAME}} --port "80:80@loadbalancer" --port "443:443@loadbalancer"
      - kubectl wait --for=condition=Ready nodes --all --timeout=60s

  down:
    desc: Supprime le cluster k3d
    cmds:
      - k3d cluster delete {{.CLUSTER_NAME}}

  restart:
    desc: Supprime et recrée le cluster, puis redéploie
    cmds:
      - task: down
      - task: up

  status:
    desc: Affiche l'état des pods dans le namespace devops
    cmds:
      - kubectl get pods -n {{.NAMESPACE}}

  logs:
    desc: Affiche les logs de tous les pods du namespace devops
    cmds:
      - kubectl logs -n {{.NAMESPACE}} --selector='app in (n8n,postgres,dozzle)' --prefix=true --max-log-requests=10

  apply:
    desc: Déploie les manifests Kubernetes
    cmds:
      - kubectl apply -f k3s/namespace.yaml
      - kubectl apply -f k3s/caddy/namespace.yaml
      - kubectl apply -R -f k3s/
      - kubectl rollout status deployment/postgres -n {{.NAMESPACE}}
      - kubectl rollout status deployment/n8n -n {{.NAMESPACE}}
      - kubectl rollout status deployment/dozzle -n {{.NAMESPACE}}

  restart:pods:
    desc: Redémarre tous les pods du namespace devops
    cmds:
      - kubectl rollout restart deployment/postgres -n {{.NAMESPACE}}
      - kubectl rollout restart deployment/n8n -n {{.NAMESPACE}}
      - kubectl rollout restart deployment/dozzle -n {{.NAMESPACE}}

  forward:
    desc: "Port-forward tous les services (n8n: 5678, dozzle: 8080)"
    deps:
      - forward:n8n
      - forward:dozzle

  forward:n8n:
    desc: Port-forward n8n sur localhost:5678
    cmds:
      - kubectl port-forward svc/n8n 5678:5678 -n {{.NAMESPACE}}

  forward:dozzle:
    desc: Port-forward dozzle sur localhost:8080
    cmds:
      - kubectl port-forward svc/dozzle 8080:8080 -n {{.NAMESPACE}}

  forward:postgres:
    desc: Port-forward postgres sur localhost:5432
    cmds:
      - kubectl port-forward svc/postgres 5432:5432 -n {{.NAMESPACE}}

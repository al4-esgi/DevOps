apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozzle
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dozzle
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dozzle
    spec:
      serviceAccountName: dozzle-viewer
      restartPolicy: Always
      containers:
        - name: dozzle
          image: amir20/dozzle:latest
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          ports:
            - containerPort: 8080
          env:
            - name: DOZZLE_MODE
              value: "k8s"
            - name: DOZZLE_ENABLE_ACTIONS
              value: "true"
            - name: DOZZLE_ENABLE_SHELL
              value: "true"
            # Pour restreindre à un namespace :
            # - name: DOZZLE_NAMESPACE
            #   value: "devops"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: dozzle-data
              mountPath: /data
      volumes:
        - name: dozzle-data
          persistentVolumeClaim:
            claimName: dozzle-pvc

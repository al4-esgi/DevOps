name: Deploy to k3S server

on:
  push:
    branches: [main]
  schedule:
    # Smoke test programmé toutes les heures via GitHub Actions
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/api
          file: ./packages/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          trivy-config: trivy.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Install task
        uses: arduino/setup-task@v2

      - name: Deploy
        run: task deploy:ci GHCR_USER=${{ github.actor }} GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Trigger smoke test job
        env:
          NS_DEVOPS: devops
        run: |
          # Déclenche un job immédiat à partir du CronJob existant
          kubectl create job --from=cronjob/smoke-tests smoke-test-ci-$(date +%s) -n $NS_DEVOPS

      - name: Wait for smoke test result
        env:
          NS_DEVOPS: devops
        run: |
          JOB_NAME=$(kubectl get jobs -n $NS_DEVOPS --sort-by=.metadata.creationTimestamp -o name | tail -1 | cut -d/ -f2)
          echo "Job: $JOB_NAME"
          kubectl wait --for=condition=complete job/$JOB_NAME -n $NS_DEVOPS --timeout=120s
          kubectl logs job/$JOB_NAME -n $NS_DEVOPS
